name = "rynell-ai-gateway"
main = "execution/cloudflare_worker.ts"
compatibility_date = "2024-01-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
PUBLIC_R2_URL = "https://storage.rynell.org"

[ai]
binding = "AI"

# Cloudflare KV Storage for CMS Content & Real-time Page Copy
[[kv_namespaces]]
binding = "CMS_KV"
id = "rynell_studio_cms_kv"
preview_id = "rynell_studio_cms_kv_preview"

# Cloudflare R2 Storage Bucket for CMS Uploads, Media Assets & Backups
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "rynell-studio-assets"
preview_bucket_name = "rynell-studio-assets-preview"

